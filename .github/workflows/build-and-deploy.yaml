name: Build & Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  test-and-verify:
    name: Test and verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # nødvendig for å hente @navikt-pakker fra GitHub Packages (pnpm install)
    timeout-minutes: 15
    steps:
      - uses: navikt/teamesyfo-github-actions-workflows/actions/setup-pnpm@eea7c65b525dfc94332000d3737a5a51207643df # main
        with:
          NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          node-version: 24.x
      - name: Run lint
        run: pnpm run lint
      - name: Run tests
        run: pnpm run test
      - name: Run build
        run: pnpm run build

  build-prod:
    if: github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
    name: Build image for prod
    runs-on: ubuntu-latest
    needs: test-and-verify
    permissions:
      contents: read
      id-token: write
      packages: write
    timeout-minutes: 15
    outputs:
      image: ${{ steps.build-and-publish.outputs.image }}
    steps:
      - uses: navikt/teamesyfo-github-actions-workflows/actions/build-next-app@eea7c65b525dfc94332000d3737a5a51207643df # main
        id: build-and-publish
        with:
          app: dulting-studio
          env: prod
          NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          node-version: 24.x

  deploy-prod:
    if: github.ref_name == 'main' && github.actor != 'dependabot[bot]'
    name: Deploy to prod
    environment:
      name: production
      url: https://dulting-studio.intern.nav.no
    runs-on: ubuntu-latest
    needs:
      - test-and-verify
      - build-prod
    permissions:
      contents: read
      id-token: write
    # 20 min: første deploy provisjonerer Cloud SQL, som kan ta flere minutter.
    timeout-minutes: 20
    concurrency:
      group: dulting-studio-deploy-prod
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: nais/deploy/actions/deploy@fa754451577294aae42872a69b888b3470478ec1 # v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: nais/nais-prod.yaml
          # Vent lenger på rollout ved første Cloud SQL-provisjonering.
          TIMEOUT: 15m
          VAR: image=${{ needs.build-prod.outputs.image }},version=${{ github.sha }}
