apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: dulting-studio
  namespace: team-esyfo
  labels:
    team: team-esyfo
spec:
  image: {{image}}
  port: 3000
  replicas:
    min: 1
    max: 1
  azure:
    application:
      enabled: true
      tenant: nav.no
      # Åpent for alle innloggede Nav-ansatte i prod nå (Wonderwall krever
      # fortsatt innlogging, men ingen gruppe-begrensning).
      # For å låse til team-esyfo senere: sett allowAllUsers: false og legg inn
      # team-esyfo sin AD-gruppe-ID under claims.groups (hold i sync med en
      # eventuell app-side allowlist i withProtectedApiRoute()):
      #   allowAllUsers: false
      #   claims:
      #     groups:
      #       - id: "<team-esyfo-gruppe-id>"
      allowAllUsers: true
    sidecar:
      enabled: true
      autoLogin: true
      autoLoginIgnorePaths:
        - /api/isAlive
        - /api/isReady
        - /api/metrics
  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
  liveness:
    path: /api/isAlive
    initialDelay: 10
    timeout: 5
    periodSeconds: 10
    failureThreshold: 10
  readiness:
    path: /api/isReady
    initialDelay: 10
    timeout: 5
    periodSeconds: 10
  prometheus:
    enabled: true
    path: /api/metrics
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
  ingresses:
    - https://dulting-studio.intern.nav.no
  accessPolicy:
    inbound:
      # Ingen app-til-app-kall inn i fase 1.1. Tilgang går via ingress og Wonderwall.
      rules: []
    outbound:
      # Ingen downstream-tjenester eller eksterne hoster før database/import-fasen er avklart.
      rules: []
      external: []
