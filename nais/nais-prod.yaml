apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: dulting-studio
  namespace: team-esyfo
  labels:
    team: team-esyfo
spec:
  image: {{image}}
  port: 3000
  replicas:
    min: 1
    max: 1
  azure:
    application:
      enabled: true
      tenant: nav.no # nav.no-tenant — ikke trygdeetaten; Z-identer støttes ikke
      # Åpent for alle innloggede Nav-ansatte på intern ingress nå (Wonderwall
      # krever fortsatt innlogging). Lås til team-esyfo senere ved å sette
      # allowAllUsers: false og legge til groups under claims (samme blokk som
      # extra under) — NAIS håndhever gruppe-tilgang i Wonderwall-laget:
      #   groups:
      #     - id: "<team-esyfo-gruppe-id>"
      allowAllUsers: true
      claims:
        # NAVident i token → brukes som «sist endret av» i tiltak-editoren.
        extra:
          - NAVident
    sidecar:
      enabled: true
      autoLogin: true
      autoLoginIgnorePaths:
        - /api/isAlive
        - /api/isReady
        - /api/metrics
  observability:
    autoInstrumentation:
      enabled: true
      runtime: nodejs
  liveness:
    path: /api/isAlive
    initialDelay: 10
    timeout: 5
    periodSeconds: 10
    failureThreshold: 10
  readiness:
    path: /api/isReady
    initialDelay: 10
    timeout: 5
    periodSeconds: 10
  prometheus:
    enabled: true
    path: /api/metrics
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      # 768Mi gir litt margin for Node 24 + OTel-agent + pg-pool (unngå OOMKill).
      memory: 768Mi
  ingresses:
    - https://dulting-studio.intern.nav.no
  accessPolicy:
    inbound:
      # Ingen app-til-app-kall inn i fase 1.1. Tilgang går via ingress og Wonderwall.
      rules: []
    outbound:
      # Ingen downstream-tjenester eller eksterne hoster før database/import-fasen er avklart.
      rules: []
      external: []
  gcp:
    sqlInstances:
      # Minimal Cloud SQL for team-delt tiltak-editor. db-f1-micro = minste
      # (delt-kjerne) tier — passer en intern, lav-trafikk demo. POSTGRES_18 =
      # nyeste major (lengst støtte). diskAutoresize: true hindrer disk-full
      # (auto-utvider; manuell diskSize ignoreres da). Migreringer kjøres på
      # app-oppstart (src/instrumentation.ts); NAIS injiserer DB_*-env
      # (envVarPrefix DB) som getDb() bygger connection-string fra.
      - type: POSTGRES_18
        tier: db-f1-micro
        diskAutoresize: true
        pointInTimeRecovery: true # backup/PITR — teamets kalibrering har verdi
        autoBackupHour: 3
        databases:
          - name: dulting-studio
            envVarPrefix: DB
