services:
  postgres:
    image: postgres:18-alpine
    container_name: dulting-studio-postgres
    environment:
      POSTGRES_DB: dulting_studio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dulting_studio"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      # PG18-imaget krever mount på /var/lib/postgresql (ikke .../data) — det
      # legger dataene i en versjons-subkatalog. Se docker-library/postgres#1259.
      - dulting-studio-postgres:/var/lib/postgresql

volumes:
  dulting-studio-postgres:
