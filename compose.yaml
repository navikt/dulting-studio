services:
  postgres:
    image: postgres:16-alpine
    container_name: dulting-studio-postgres
    environment:
      POSTGRES_DB: dulting_studio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dulting_studio"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - dulting-studio-postgres:/var/lib/postgresql/data

volumes:
  dulting-studio-postgres:
